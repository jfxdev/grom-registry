services:
  grom:
    environment:
      GROM_DATABASE_URL: postgres://grom:${GROM_POSTGRES_PASSWORD:-grom-local-password}@postgres:5432/grom?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grom
      POSTGRES_USER: grom
      POSTGRES_PASSWORD: ${GROM_POSTGRES_PASSWORD:-grom-local-password}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grom -d grom"]
      start_period: 10s
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:${GROM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  recovery:
    command:
      - recovery
      - --listen=:8080
      - --postgres-database-url=postgres://grom:${GROM_POSTGRES_PASSWORD:-grom-local-password}@postgres-recovery:5432/grom?sslmode=disable
    depends_on:
      postgres-recovery:
        condition: service_healthy

  postgres-recovery:
    image: postgres:18-alpine
    profiles: ["recovery"]
    environment:
      POSTGRES_DB: grom
      POSTGRES_USER: grom
      POSTGRES_PASSWORD: ${GROM_POSTGRES_PASSWORD:-grom-local-password}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grom -d grom"]
      start_period: 10s
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres-data:
