services:
  grom:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      GROM_HTTP_ADDRESS: :8080
      GROM_DEPLOYMENT_PROFILE: ${GROM_DEPLOYMENT_PROFILE:-development}
      GROM_PUBLIC_URL: ${GROM_PUBLIC_URL:-http://localhost:8080}
      GROM_DATABASE_URL: sqlite:///data/grom.db
      GROM_DATA_DIR: /data
      GROM_SIGNING_KEY_PATH: /certs/signing-key.pem
      GROM_SIGNING_CERT_PATH: /certs/signing-cert.pem
      GROM_SIGNING_JWKS_PATH: /certs/jwks.json
      GROM_REGISTRY_URL: http://distribution:5000
      GROM_BOOTSTRAP_ADMIN_EMAIL: ${GROM_BOOTSTRAP_ADMIN_EMAIL:-admin@grom.local}
      GROM_BOOTSTRAP_ADMIN_USERNAME: ${GROM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GROM_BOOTSTRAP_ADMIN_PASSWORD: ${GROM_BOOTSTRAP_ADMIN_PASSWORD:?set GROM_BOOTSTRAP_ADMIN_PASSWORD in .env}
      GROM_SECURE_COOKIES: ${GROM_SECURE_COOKIES:-false}
      GROM_ALLOW_INSECURE_PRIVATE_HTTP: ${GROM_ALLOW_INSECURE_PRIVATE_HTTP:-false}
      GROM_TRUSTED_PROXIES: ${GROM_TRUSTED_PROXIES:-}
      GROM_AUTH_FAILURE_LIMIT: ${GROM_AUTH_FAILURE_LIMIT:-5}
      GROM_AUTH_FAILURE_WINDOW: ${GROM_AUTH_FAILURE_WINDOW:-5m}
      GROM_AUTH_BLOCK_DURATION: ${GROM_AUTH_BLOCK_DURATION:-15m}
      GROM_REGISTRY_TOKEN_TTL: ${GROM_REGISTRY_TOKEN_TTL:-5m}
    ports:
      - "${GROM_BIND_ADDRESS:-127.0.0.1}:${GROM_HTTP_PORT:-8080}:8080"
    volumes:
      - grom-data:/data
      - signing-certs:/certs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  distribution:
    image: registry:3
    environment:
      REGISTRY_AUTH_TOKEN_REALM: ${GROM_PUBLIC_URL:-http://localhost:8080}/auth/token
      REGISTRY_AUTH_TOKEN_SERVICE: grom-registry
      REGISTRY_AUTH_TOKEN_ISSUER: grom
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /certs/signing-cert.pem
      REGISTRY_AUTH_TOKEN_JWKS: /certs/jwks.json
      REGISTRY_HTTP_SECRET: ${GROM_REGISTRY_HTTP_SECRET:-grom-local-http-secret-change-me}
    volumes:
      - ../distribution/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
      - signing-certs:/certs:ro
    depends_on:
      grom:
        condition: service_healthy
    restart: unless-stopped

volumes:
  grom-data:
  registry-data:
  signing-certs:
