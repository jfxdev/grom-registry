name: Boot Acceptance E2E

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-acceptance-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-acceptance-e2e:
    name: Boot Acceptance E2E (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
      - name: Run mandatory boot acceptance journey
        env:
          GROM_RUN_BOOT_ACCEPTANCE: "1"
        run: make test-boot-acceptance
