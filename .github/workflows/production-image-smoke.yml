name: Production Image Smoke

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-image-smoke:
    name: Production Image Smoke (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
      - name: Build and smoke-test production image
        run: deploy/compose/smoke-production-image.sh
