name: Registry E2E

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-e2e:
    name: Registry E2E (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      # The generic-artifact journey drives a real ORAS client, which is how
      # OpenTofu modules, Helm charts and SBOMs are actually published.
      - name: Install the ORAS CLI
        shell: bash
        env:
          ORAS_VERSION: 1.3.0
          ORAS_SHA256: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64
        run: |
          set -euo pipefail
          curl -fsSL -o oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tar.gz" | sha256sum --check --strict
          tar -xzf oras.tar.gz oras
          sudo install -m 0755 oras /usr/local/bin/oras
          rm -f oras oras.tar.gz
          oras version

      - name: Run mandatory registry journey
        env:
          GROM_RUN_REGISTRY_E2E: "1"
        run: make test-registry-e2e
